<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#161915}canvas{display:block}</style></head><body><script type="module">
import * as THREE from './three.module.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1920,1080);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(32,16/9,.1,100);
const load=async url=>{const t=await new THREE.TextureLoader().loadAsync(url);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;};
const [room,hero,projects]=await Promise.all([load('./studio.webp'),load('./screen-home.png'),load('./screen-projects.png')]);
scene.background=room;
const environment=room.clone();environment.mapping=THREE.EquirectangularReflectionMapping;scene.environment=environment;
scene.add(new THREE.HemisphereLight(0xf5f3ea,0x5f5140,3));
const key=new THREE.DirectionalLight(0xffedcf,4);key.position.set(-4,6,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xddeeff,3);rim.position.set(5,5,-1);scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,1.5);fill.position.set(0,3,7);scene.add(fill);
const group=new THREE.Group();scene.add(group);
function rounded(w,h,r){const s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s;}
const bodyMat=new THREE.MeshStandardMaterial({color:0x16191c,metalness:.65,roughness:.28});
const edgeMat=new THREE.MeshStandardMaterial({color:0x363b3e,metalness:.8,roughness:.24});
const metal=new THREE.MeshStandardMaterial({color:0xa0a5a7,metalness:.78,roughness:.28});
function solid(w,h,d,r,mat,x,y,z){const g=new THREE.ExtrudeGeometry(rounded(w,h,r),{depth:d,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.014,bevelThickness:.014,curveSegments:12});const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);group.add(m);return m;}
solid(6.66,4.22,.13,.09,edgeMat,0,3,-.14);solid(6.62,4.18,.035,.07,bodyMat,0,3,-.01);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(6.40,4.00),new THREE.MeshBasicMaterial({map:hero,toneMapped:false}));screen.position.set(0,3,.055);group.add(screen);
// A slim physical bezel, rear housing, and machined aluminium stand.
solid(1.0,1.20,.16,.04,metal,0,.63,-.36);
const foot=new THREE.Mesh(new THREE.BoxGeometry(1.68,.09,1.05),metal);foot.position.set(0,.04,-.1);group.add(foot);
const cameraDot=new THREE.Mesh(new THREE.CircleGeometry(.018,24),new THREE.MeshStandardMaterial({color:0x020509,roughness:.15,metalness:.4}));cameraDot.position.set(0,5.065,.047);group.add(cameraDot);
const led=new THREE.Mesh(new THREE.CircleGeometry(.007,16),new THREE.MeshBasicMaterial({color:0xcbdad9}));led.position.set(3.17,.96,.048);group.add(led);
// Soft contact shadow projected onto the photographic tabletop.
const cv=document.createElement('canvas');cv.width=512;cv.height=256;const cx=cv.getContext('2d');const grad=cx.createRadialGradient(256,128,20,256,128,235);grad.addColorStop(0,'rgba(0,0,0,.42)');grad.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=grad;cx.fillRect(0,0,512,256);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(5,2.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false,toneMapped:false}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-.012,-.15);scene.add(shadow);
const shots=[
{start:0,end:6,a:[1.25,3.5,14.2],b:[.35,3.2,11.8],ta:[0,2.30,0],tb:[0,2.30,0],map:hero},
{start:6,end:11,a:[-4.5,3.9,6.6],b:[-3.65,3.55,6.05],ta:[-.55,3.45,0],tb:[-.35,3.35,0],map:hero},
{start:11,end:16,a:[4.4,4.0,7.1],b:[3.6,3.5,6.25],ta:[.5,3.1,0],tb:[.35,3.05,0],map:projects},
{start:16,end:22,a:[1.5,3.4,10.7],b:[.35,3.4,14.2],ta:[0,2.30,0],tb:[0,2.30,0],map:hero}
];
const lerp=(a,b,t)=>a+(b-a)*t;
window.renderFrame=(time)=>{const s=shots.find(s=>time>=s.start&&time<s.end)||shots.at(-1);const u=Math.max(0,Math.min(1,(time-s.start)/(s.end-s.start)));const t=u*u*(3-2*u);camera.position.set(...s.a.map((a,i)=>lerp(a,s.b[i],t)));camera.lookAt(new THREE.Vector3(...s.ta.map((a,i)=>lerp(a,s.tb[i],t))));screen.material.map=s.map;renderer.render(scene,camera);return renderer.domElement.toDataURL('image/jpeg',.97).split(',')[1];};
window.renderFrame(0);window.ready=true;
</script></body></html>
