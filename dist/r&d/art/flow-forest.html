<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Forest — Canopy Intelligence</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 12px;
            margin-bottom: 28px;
            line-height: 1.55;
            font-style: italic;
        }

        .control-section { margin-bottom: 26px; }

        .control-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
            color: var(--anthropic-dark);
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.12);
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group { margin-bottom: 17px; }

        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 7px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 3px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 44px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-family: 'Poppins', sans-serif;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }

        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }

        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 900px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(20, 20, 19, 0.18);
            background: #12140e;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            font-size: 15px;
            color: #4a6040;
            font-style: italic;
            background: #12140e;
        }

        .divider {
            height: 1px;
            background: var(--anthropic-light-gray);
            margin-bottom: 26px;
        }

        @media (max-width: 680px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ── Sidebar ──────────────────────────────────── -->
    <div class="sidebar">
        <h1>Flow Forest</h1>
        <div class="subtitle">Paths that discover themselves — roots, canopy, and the intelligence of systems that never planned to be beautiful.</div>

        <!-- Seed Section -->
        <div class="control-section">
            <h3>Seed</h3>
            <input type="number" id="seed-input" class="seed-input" value="42847" onchange="updateSeed()">
            <div class="seed-controls">
                <button class="button secondary" onclick="previousSeed()">← Prev</button>
                <button class="button secondary" onclick="nextSeed()">Next →</button>
            </div>
            <button class="button tertiary" style="width:100%;" onclick="randomSeedAndUpdate()">↻ Random</button>
        </div>

        <div class="divider"></div>

        <!-- Parameters Section -->
        <div class="control-section">
            <h3>Parameters</h3>

            <div class="control-group">
                <label>Particle Count</label>
                <div class="slider-container">
                    <input type="range" id="particleCount" min="500" max="7000" step="250" value="4000"
                           oninput="updateParam('particleCount', parseInt(this.value))">
                    <span class="value-display" id="particleCount-value">4000</span>
                </div>
            </div>

            <div class="control-group">
                <label>Rise Strength</label>
                <div class="slider-container">
                    <input type="range" id="riseStrength" min="0.10" max="1.50" step="0.05" value="0.70"
                           oninput="updateParam('riseStrength', parseFloat(this.value))">
                    <span class="value-display" id="riseStrength-value">0.70</span>
                </div>
            </div>

            <div class="control-group">
                <label>Flow Complexity</label>
                <div class="slider-container">
                    <input type="range" id="flowComplexity" min="0.10" max="1.00" step="0.05" value="0.65"
                           oninput="updateParam('flowComplexity', parseFloat(this.value))">
                    <span class="value-display" id="flowComplexity-value">0.65</span>
                </div>
            </div>

            <div class="control-group">
                <label>Trail Density</label>
                <div class="slider-container">
                    <input type="range" id="trailDensity" min="2" max="22" step="1" value="7"
                           oninput="updateParam('trailDensity', parseInt(this.value))">
                    <span class="value-display" id="trailDensity-value">7</span>
                </div>
            </div>

            <div class="control-group">
                <label>Light Breaks</label>
                <div class="slider-container">
                    <input type="range" id="lightBreakDensity" min="0.01" max="0.22" step="0.01" value="0.06"
                           oninput="updateParam('lightBreakDensity', parseFloat(this.value))">
                    <span class="value-display" id="lightBreakDensity-value">0.06</span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Actions Section -->
        <div class="control-section">
            <h3>Actions</h3>
            <div class="button-row">
                <button class="button" onclick="initializeSystem()">Regenerate</button>
                <button class="button secondary" onclick="resetParameters()">Reset</button>
            </div>
            <button class="button tertiary" style="width:100%; margin-top:8px;"
                    onclick="saveCanvas('flow-forest-' + params.seed, 'png')">↓ Download PNG</button>
        </div>
    </div>

    <!-- ── Canvas ────────────────────────────────────── -->
    <div class="canvas-area">
        <div id="canvas-container">
            <div class="loading" id="loading-msg">Seeding the forest…</div>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// FLOW FOREST — CANOPY INTELLIGENCE
// A generative art system expressing the emergent wisdom of organic paths
// ════════════════════════════════════════════════════════════════════════════

// ── Parameters ──────────────────────────────────────────────────────────────
let params = {
    seed:              42847,
    particleCount:     4000,
    riseStrength:      0.70,
    flowComplexity:    0.65,
    trailDensity:      7,
    lightBreakDensity: 0.06,
};

const defaultParams = { ...params };

// ── Color Palette (eucalyptus dawn) ─────────────────────────────────────────
let pal = {};

// ── System State ─────────────────────────────────────────────────────────────
let particles  = [];
let globalTime = 0;

// Background color constant (used for both clear and fade rect)
const BG_R = 18, BG_G = 20, BG_B = 14;

// ════════════════════════════════════════════════════════════════════════════
// P5.JS LIFECYCLE
// ════════════════════════════════════════════════════════════════════════════

function setup() {
    let cnv = createCanvas(1200, 1200);
    cnv.parent('canvas-container');
    document.getElementById('loading-msg').style.display = 'none';
    colorMode(RGB, 255);
    defineColors();
    initializeSystem();
}

function draw() {
    // Near-invisible fade: trails are almost permanent, building layered density.
    // Balance: active paths accumulate; inactive regions breathe slowly back.
    noStroke();
    fill(BG_R, BG_G, BG_B, 3);
    rect(0, 0, width, height);

    for (let p of particles) {
        p.update();
        p.render();
    }

    globalTime++;
}

// ════════════════════════════════════════════════════════════════════════════
// PALETTE DEFINITION
// Dawn through eucalyptus: root shadow → sage → warm sage → gold → light
// ════════════════════════════════════════════════════════════════════════════

function defineColors() {
    pal.bg        = color(BG_R,  BG_G,  BG_B );  // Deep forest dark
    pal.root0     = color( 20,   24,   15  );      // Darkest root
    pal.root1     = color( 35,   44,   26  );      // Dark root green
    pal.root2     = color( 52,   66,   38  );      // Root–sage boundary
    pal.sage0     = color( 66,   86,   50  );      // Deep sage
    pal.sage1     = color( 88,  114,   68  );      // Mid sage
    pal.sage2     = color(112,  142,   88  );      // Light sage
    pal.sage3     = color(136,  163,  108  );      // Silver sage
    pal.warmSage  = color(160,  166,  102  );      // Eucalyptus warmth
    pal.gold0     = color(188,  160,   74  );      // Eucalyptus gold
    pal.gold1     = color(214,  186,   84  );      // Dawn gold
    pal.gold2     = color(232,  206,   96  );      // Bright canopy gold
    pal.light0    = color(244,  230,  164  );      // Soft dawn light
    pal.light1    = color(252,  245,  206  );      // Full light break
}

// ════════════════════════════════════════════════════════════════════════════
// SYSTEM INITIALIZATION
// ════════════════════════════════════════════════════════════════════════════

function initializeSystem() {
    randomSeed(params.seed);
    noiseSeed(params.seed);
    globalTime = 0;

    particles = [];
    for (let i = 0; i < params.particleCount; i++) {
        particles.push(new Particle(i));
    }

    // Begin in darkness — the forest will grow into the light
    background(BG_R, BG_G, BG_B);
}

// ════════════════════════════════════════════════════════════════════════════
// PARTICLE CLASS
// ════════════════════════════════════════════════════════════════════════════

class Particle {
    constructor(id) {
        this.id = id;
        this.spawn();

        // Stagger initial lifecycle so the forest populates immediately
        // rather than all rising from root simultaneously
        this.age = floor(random(0, this.maxAge * 0.7));

        // Scatter 60% of initial particles throughout the canvas height
        // so the first frame shows an already-breathing composition
        if (random() < 0.60) {
            this.y    = random(height * 0.08, height * 0.98);
            this.prevY = this.y;
            // Give scattered particles a plausible starting velocity
            let initAngle = random(TWO_PI);
            this.vx = cos(initAngle) * this.baseSpeed * 0.3;
            this.vy = -this.baseSpeed * params.riseStrength * 0.5;
        }
    }

    // ── Spawn / Respawn ───────────────────────────────────────────────────
    spawn() {
        // Root zone — biased toward lower canvas via power curve
        let depthBias = pow(random(), 0.55);
        this.x     = width  * (0.04 + random() * 0.92);
        this.y     = height * (0.52 + depthBias * 0.48);
        this.prevX = this.x;
        this.prevY = this.y;

        this.vx        = 0;
        this.vy        = 0;
        this.age       = 0;
        this.maxAge    = random(220, 680);
        this.baseSpeed = random(0.42, 1.95);
        this.sw        = random(0.14, 0.82);  // stroke weight

        // ── Ecological type assignment ────────────────────────────────────
        // Each type enacts a different relationship to the shared flow field.
        let roll = random();
        if (roll < 0.030) {
            // LIGHT — rare, fine, rises fastest, carries luminance upward
            this.type = 'light';
            this.sw        = random(0.10, 0.42);
            this.baseSpeed = random(0.75, 2.10);
            this.maxAge    = random(180, 500);
        } else if (roll < 0.165) {
            // BRANCH — lateral dispersers, create horizontal canopy density
            this.type = 'branch';
            this.sw   = random(0.18, 0.70);
        } else if (roll < 0.330) {
            // ROOT — deep, slow, thick; the dark anchoring grammar
            this.type      = 'root';
            this.y         = height * (0.76 + random() * 0.24);
            this.prevY     = this.y;
            this.baseSpeed = random(0.18, 0.72);
            this.sw        = random(0.38, 1.35);
            this.maxAge    = random(140, 380);
        } else {
            // TENDRIL — primary population; upward flow with organic drift
            this.type = 'tendril';
        }

        // Each particle inhabits its own slice of noise space —
        // they share the same field but experience it differently
        this.nz1 = random(0,   450);
        this.nz2 = random(450, 900);
    }

    // ── Update ────────────────────────────────────────────────────────────
    update() {
        // Time advances slowly — the forest breathes, never settles
        let t = globalTime * 0.00032;

        // ── Multi-octave flow field ──────────────────────────────────────
        // Large scale (s1): slow forest-structure drift — the majestic rhythms
        // Medium scale (s2): branch-level variation — the local negotiations
        let s1 = 0.0026;
        let s2 = 0.0072 * (0.38 + params.flowComplexity * 0.62);

        let n1 = noise(this.x * s1, this.y * s1, this.nz1 + t);
        let n2 = noise(this.x * s2, this.y * s2, this.nz2 + t * 1.7) * params.flowComplexity;

        // Blend scales: more complexity = more medium-scale influence
        let blend = (n1 + n2) / (1.0 + params.flowComplexity);
        let angle = blend * TWO_PI * 2.45;

        // ── Type-modulated force multipliers ────────────────────────────
        let lateralMod, riseMod;
        switch (this.type) {
            case 'root':    lateralMod = 0.38; riseMod = 0.52; break;
            case 'branch':  lateralMod = 1.95; riseMod = 0.32; break;
            case 'light':   lateralMod = 0.42; riseMod = 1.35; break;
            default:        lateralMod = 0.62; riseMod = 1.00; break;
        }

        // ── Upward force ─────────────────────────────────────────────────
        let h = 1.0 - this.y / height;  // 0 = bottom, 1 = top

        // Taper rise near crown — particles spread and slow as they reach light
        let crownTaper = h > 0.72 ? map(h, 0.72, 1.0, 1.0, 0.22) : 1.0;

        // Subtle center-warmth: paths near the middle rise slightly faster
        let cx = (this.x / width) - 0.5;
        let centerWarm = 1.0 + (1.0 - min(abs(cx) * 2.4, 1.0)) * 0.28;

        let upForce = -params.riseStrength * riseMod * crownTaper * centerWarm * this.baseSpeed;

        // ── Crown convergence ────────────────────────────────────────────
        // In upper canopy, branches arc gently inward (canopy negotiates space)
        let crownPull = h > 0.62 ? -cx * (h - 0.62) * 0.72 : 0.0;

        // ── Compose target velocity ──────────────────────────────────────
        let targetVX = (cos(angle) * lateralMod + crownPull) * this.baseSpeed;
        let targetVY =  sin(angle) * 0.32         * this.baseSpeed + upForce;

        // ── Inertia — the "discovery" quality ───────────────────────────
        // Velocity changes slowly toward the field: particles carry history.
        // This single constant — tuned across many iterations — is what makes
        // paths feel like negotiation rather than obedience.
        let inertia = this.type === 'branch' ? 0.044 : 0.058;
        this.vx = lerp(this.vx, targetVX, inertia);
        this.vy = lerp(this.vy, targetVY, inertia);

        this.prevX = this.x;
        this.prevY = this.y;
        this.x += this.vx;
        this.y += this.vy;
        this.age++;

        // Respawn when particle exits canvas or completes its lifecycle
        if (this.x < -10 || this.x > width + 10 || this.y < -12 || this.age >= this.maxAge) {
            this.spawn();
        }
    }

    // ── Render ────────────────────────────────────────────────────────────
    render() {
        let h = 1.0 - this.y / height;

        // Lifecycle fade: soft in, soft out — particles arrive and depart gently
        let fadeIn  = constrain(this.age / 30.0, 0, 1);
        let fadeOut = constrain((this.maxAge - this.age) / 30.0, 0, 1);
        let alpha   = params.trailDensity * fadeIn * fadeOut;

        if (alpha < 0.7) return;  // Skip near-invisible strokes

        let c = this.getColor(h);
        stroke(red(c), green(c), blue(c), alpha);
        strokeWeight(this.sw);
        line(this.prevX, this.prevY, this.x, this.y);
    }

    // ── Color ─────────────────────────────────────────────────────────────
    getColor(h) {
        // LIGHT type: warms to gold-cream as it ascends
        if (this.type === 'light' && h > 0.28) {
            let t = constrain((h - 0.28) / 0.72, 0, 1);
            // Ease-in curve: slow gold, then bursts into cream near the crown
            return lerpColor(pal.gold0, pal.light1, t * t);
        }

        // Noise-driven light breaks in upper canopy —
        // the unpredictable moments when light actually gets through
        if (h > 0.55) {
            let ln = noise(
                this.x * 0.0085,
                this.y * 0.0085,
                9998 + globalTime * 0.00072
            );
            let thresh = 1.0 - params.lightBreakDensity * 7.8;
            if (ln > thresh) {
                let lt = (ln - thresh) / max(1.0 - thresh, 0.001);
                return lerpColor(pal.gold2, pal.light1, lt);
            }
        }

        // ── Height gradient: the chromatic ecology of a forest ────────────
        // Each band corresponds to a real ecological zone.
        // Calibrated for accumulation: looks right after 500+ frames of layering.
        if (h < 0.10) return lerpColor(pal.root0,  pal.root1,    h              / 0.10);
        if (h < 0.24) return lerpColor(pal.root1,  pal.root2,   (h - 0.10)     / 0.14);
        if (h < 0.38) return lerpColor(pal.root2,  pal.sage0,   (h - 0.24)     / 0.14);
        if (h < 0.50) return lerpColor(pal.sage0,  pal.sage1,   (h - 0.38)     / 0.12);
        if (h < 0.62) return lerpColor(pal.sage1,  pal.sage2,   (h - 0.50)     / 0.12);
        if (h < 0.72) return lerpColor(pal.sage2,  pal.sage3,   (h - 0.62)     / 0.10);
        if (h < 0.80) return lerpColor(pal.sage3,  pal.warmSage,(h - 0.72)     / 0.08);
        if (h < 0.88) return lerpColor(pal.warmSage, pal.gold0, (h - 0.80)     / 0.08);
        if (h < 0.94) return lerpColor(pal.gold0,  pal.gold1,   (h - 0.88)     / 0.06);
        return             lerpColor(pal.gold1,  pal.gold2,   (h - 0.94)     / 0.06);
    }
}

// ════════════════════════════════════════════════════════════════════════════
// UI CONTROL HANDLERS
// ════════════════════════════════════════════════════════════════════════════

function updateParam(name, val) {
    params[name] = val;
    let disp = Number.isInteger(val) ? String(val) : val.toFixed(2);
    document.getElementById(name + '-value').textContent = disp;

    // particleCount requires full rebuild; all others update live
    if (name === 'particleCount') initializeSystem();
}

// ── Seed Controls ─────────────────────────────────────────────────────────

function updateSeedDisplay() {
    document.getElementById('seed-input').value = params.seed;
}

function updateSeed() {
    let v = parseInt(document.getElementById('seed-input').value);
    if (v > 0) { params.seed = v; initializeSystem(); }
    else updateSeedDisplay();
}

function previousSeed() {
    params.seed = max(1, params.seed - 1);
    updateSeedDisplay();
    initializeSystem();
}

function nextSeed() {
    params.seed += 1;
    updateSeedDisplay();
    initializeSystem();
}

function randomSeedAndUpdate() {
    params.seed = floor(Math.random() * 999999) + 1;
    updateSeedDisplay();
    initializeSystem();
}

// ── Reset ─────────────────────────────────────────────────────────────────

function resetParameters() {
    params = { ...defaultParams };
    updateSeedDisplay();

    document.getElementById('particleCount').value        = params.particleCount;
    document.getElementById('particleCount-value').textContent = params.particleCount;

    document.getElementById('riseStrength').value         = params.riseStrength;
    document.getElementById('riseStrength-value').textContent  = params.riseStrength.toFixed(2);

    document.getElementById('flowComplexity').value       = params.flowComplexity;
    document.getElementById('flowComplexity-value').textContent = params.flowComplexity.toFixed(2);

    document.getElementById('trailDensity').value         = params.trailDensity;
    document.getElementById('trailDensity-value').textContent  = params.trailDensity;

    document.getElementById('lightBreakDensity').value    = params.lightBreakDensity;
    document.getElementById('lightBreakDensity-value').textContent = params.lightBreakDensity.toFixed(2);

    initializeSystem();
}

// ── Init ─────────────────────────────────────────────────────────────────

window.addEventListener('load', () => {
    updateSeedDisplay();
});
</script>
</body>
